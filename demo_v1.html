<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Démo — Détection de Fraude Bancaire</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 22px; }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  label { display: block; margin-top: 12px; font-size: 13px; font-weight: 600; color: #444; }
  input, select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 18px; padding: 10px 18px; background: #1F4E5F; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { background: #163a47; }
  #result { margin-top: 16px; padding: 14px; border-radius: 8px; font-size: 14px; display: none; white-space: pre-wrap; }
  .risque-FAIBLE { background: #e6f4ea; border: 1px solid #34a853; }
  .risque-MOYEN { background: #fff4e5; border: 1px solid #f9a825; }
  .risque-ÉLEVÉ { background: #fdecea; border: 1px solid #e53935; }
  .apiurl { font-size: 12px; color: #666; }
</style>
</head>
<body>
  <h1>Démo — API Détection de Fraude Bancaire</h1>
  <p class="apiurl">URL de l'API : <input id="apiBase" value="http://localhost:8000" /></p>

  <div class="card">
    <label>Scénario / modèle</label>
    <select id="scenario">
      <option value="scenario2">Scenario 2 — binaire (Normal/Fraude) — recommandé</option>
      <option value="scenario1">Scenario 1 — 3 classes (Normal/Suspect/Fraude)</option>
    </select>

    <label>Identifiant client</label>
    <input id="id_client" value="C002" />

    <label>Type de transaction</label>
    <select id="type_transaction">
      <option>ATM</option>
      <option>Paiement en ligne</option>
      <option>Paiement électronique</option>
    </select>

    <label>Statut opération</label>
    <select id="status_operation">
      <option>Validé</option>
      <option>Echoué</option>
      <option>En attente</option>
    </select>

    <label>Localisation</label>
    <input id="localisation" value="Dakar" />

    <label>Date / heure</label>
    <input id="date" type="datetime-local" />

    <label>Montant (FCFA)</label>
    <input id="montant" type="number" value="50000" />

    <button onclick="scoreTransaction()">Analyser la transaction</button>

    <div id="result"></div>
  </div>

  <script>
    document.getElementById('date').value = new Date().toISOString().slice(0,16);

    async function scoreTransaction() {
      const apiBase = document.getElementById('apiBase').value.replace(/\/$/, '');
      const scenario = document.getElementById('scenario').value;
      const payload = {
        id_client: document.getElementById('id_client').value,
        type_transaction: document.getElementById('type_transaction').value,
        status_operation: document.getElementById('status_operation').value,
        localisation: document.getElementById('localisation').value,
        date: document.getElementById('date').value + ':00',
        montant: parseFloat(document.getElementById('montant').value),
      };

      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.className = '';
      resultDiv.textContent = 'Analyse en cours...';

      try {
        const res = await fetch(`${apiBase}/predict/${scenario}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const err = await res.text();
          throw new Error(err);
        }
        const data = await res.json();
        resultDiv.className = `risque-${data.niveau_risque}`;
        resultDiv.textContent =
          `Classe prédite : ${data.classe_predite}\n` +
          `Niveau de risque : ${data.niveau_risque}\n` +
          `Alerte : ${data.alerte ? 'OUI' : 'non'}\n` +
          `Probabilités : ${JSON.stringify(data.probabilites)}`;
      } catch (e) {
        resultDiv.className = 'risque-ÉLEVÉ';
        resultDiv.textContent = 'Erreur : ' + e.message + '\n\n(Vérifiez que l\'API est lancée et accessible à l\'URL indiquée ci-dessus.)';
      }
    }
  </script>
</body>
</html>
